[package]
name = "payments-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
csv-async = { version = "1.3", features = ["tokio"] }
fastnum = { version = "0.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
